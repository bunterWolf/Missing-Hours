<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
// Called by store/template/render.js for each image. job: { layout: 'screenshot' | 'hero',
// theme: 'light' | 'dark', lang, headline?, subline?, windows: [{ src (file URL), theme }] }.
// Resolves to the layout problems once fonts and images are ready.
window.renderJob = async function renderJob(job) {
  document.documentElement.lang = job.lang;
  document.body.className = `layout-${job.layout} ${job.theme}`;
  document.body.replaceChildren();
  const add = (parent, tag, className, text) => {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    parent.appendChild(el);
    return el;
  };
  if (job.layout === 'screenshot') {
    const copy = add(document.body, 'div', 'copy');
    add(copy, 'h1', 'headline', job.headline);
    add(copy, 'p', 'subline', job.subline);
    const brand = add(document.body, 'div', 'brand');
    add(brand, 'img').src = '../../resources/icon.png';
    brand.appendChild(document.createTextNode('Missing Hours')); // product name, not translated
  }
  for (const { src, theme } of job.windows) {
    const frame = add(document.body, 'div', `window is-${theme}`);
    add(frame, 'img').src = src;
  }
  await Promise.all([...document.images].map((img) => img.decode()));
  // Place each capture pixel for pixel: 437 CSS px at 250 % is 1092.5 px, the capture has 1093.
  for (const img of document.querySelectorAll('.window img')) {
    img.parentElement.style.width = `${img.naturalWidth / devicePixelRatio}px`;
    img.parentElement.style.height = `${img.naturalHeight / devicePixelRatio}px`;
  }
  await document.fonts.ready;
  return findProblems();
};

// Headline at most 2 lines, subline at most 3; nothing outside the canvas; the text stays clear of
// the window and the product name.
function findProblems() {
  const problems = [];
  const lines = (el) => {
    const range = document.createRange();
    range.selectNodeContents(el);
    return new Set([...range.getClientRects()].filter((r) => r.width > 0).map((r) => Math.round(r.top))).size;
  };
  const headline = document.querySelector('.headline');
  const subline = document.querySelector('.subline');
  if (headline && lines(headline) > 2) problems.push(`headline wraps to ${lines(headline)} lines`);
  if (subline && lines(subline) > 3) problems.push(`subline wraps to ${lines(subline)} lines`);
  const box = (el) => el.getBoundingClientRect();
  for (const el of document.querySelectorAll('.copy, .brand, .window')) {
    const r = box(el);
    if (r.left < 0 || r.top < 0 || r.right > innerWidth || r.bottom > innerHeight) problems.push(`${el.className} is outside the image`);
  }
  const copy = document.querySelector('.copy');
  const brand = document.querySelector('.brand');
  const win = document.querySelector('.window');
  if (copy && win && box(copy).right > box(win).left) problems.push('text runs into the window');
  if (copy && brand && box(copy).bottom > box(brand).top) problems.push('text runs into the product name');
  for (const el of document.querySelectorAll('.headline, .subline')) {
    if (el.scrollWidth > el.clientWidth + 1) problems.push(`${el.className} has a word wider than the column`);
  }
  return problems;
}
</script>
</body>
</html>
